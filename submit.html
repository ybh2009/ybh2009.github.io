<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>投稿建议箱</title>
    <style>
        body { max-width: 600px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 8px; }
        button { background: #07c; color: white; padding: 10px 20px; border: none; }
    </style>
</head>
<body>
    <h2>📮 投稿/建议箱</h2>
    <form id="submitForm">
        <div class="form-group">
            <label>类型：</label>
            <select name="type" required>
                <option value="建议">建议</option>
                <option value="投稿">投稿</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>内容：</label>
            <textarea name="content" rows="5" required></textarea>
        </div>
        
        <div class="form-group">
            <label>联系方式：</label>
            <input type="text" name="contact" placeholder="微信/电话/无需联系" required>
        </div>
        
        <button type="submit">提交</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('submitForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                type: e.target.type.value,
                content: e.target.content.value,
                contact: e.target.contact.value
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbxg2nEonzsNzYZPBxNcCTxPB9KlpVyFnCeITNlS70zEwE4tOQ-V-r38cX7l7xLnvzltEA/exec', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                
                if(response.ok) {
                    document.getElementById('result').innerHTML = "✅ 提交成功！";
                    e.target.reset();
                }
            } catch (error) {
                document.getElementById('result').innerHTML = "❌ 提交失败，请稍后重试";
            }
        });
    </script>
</body>
</html>
